name: Refresh profile activity

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/**
      - .github/workflows/update-profile.yml

permissions:
  contents: read

concurrency:
  group: profile-art
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out profile
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify generator
        run: python3 -m unittest discover -s tests -v
      - name: Fetch public activity and render SVGs
        run: python3 scripts/update_profile.py
      - name: Commit changed profile assets
        run: |
          git add assets/ data/contributions.json
          if git diff --cached --quiet; then
            echo "Profile is already current."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh profile activity [skip ci]'
          git push
